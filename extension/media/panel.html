<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}'; frame-src http://127.0.0.1:*;"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--vscode-editor-background, #1e1e1e);
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="dsh" title="DeepSeek Harness" src="{{DSH_URL}}"></iframe>
    <script nonce="{{NONCE}}">
      // Phase 2A bridge: the DSH SPA (http://127.0.0.1:<port>) posts
      // `{ type: 'dsh:openInEditor', file, line? }` when the user clicks
      // "Open in VS Code". Only loopback iframe messages are forwarded to the
      // extension host; the parent document still runs no other scripts.
      const vscode = acquireVsCodeApi();
      const dshFrame = document.getElementById('dsh');
      window.addEventListener('message', (event) => {
        if (event.source !== dshFrame.contentWindow) return;
        if (!/^http:\/\/127\.0\.0\.1:\d+$/.test(event.origin)) return;
        const data = event.data;
        if (!data || data.type !== 'dsh:openInEditor' || typeof data.file !== 'string') return;
        vscode.postMessage({
          type: 'dsh.openInEditor',
          file: data.file,
          line: typeof data.line === 'number' ? data.line : undefined,
          character: typeof data.character === 'number' ? data.character : undefined,
        });
      });
    </script>
  </body>
</html>
